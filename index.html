<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chiwamba Awards">
<title>Chiwamba Awards 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--black:#0d0d0d;--gold:#f2b705;--gold-d:#b97a00;--red:#d4141c;--paper:#fff;--cream:#fbf7ec;--line:#e6dfcc;--ink:#1a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Montserrat,system-ui,sans-serif}
.gold-t{background:linear-gradient(#ffe68a,var(--gold) 55%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{text-align:center;padding:18px 20px 0}
.top img{width:min(300px,70%);height:auto}
.banner{max-width:760px;margin:6px auto 0;padding:0 16px}
.plate{background:var(--black);border:3px solid var(--gold);border-radius:22px;padding:22px 16px 40px;text-align:center}
.plate h1{margin:0;font-weight:900;font-size:clamp(2.4rem,11vw,5rem);line-height:1;letter-spacing:-.01em}
.plate h1 small{display:block;color:#fff;font-size:1.15em;text-shadow:0 3px 0 var(--gold-d)}
.ribbon{margin:-26px 14px 0;position:relative;background:var(--red);color:#fff;text-align:center;font-weight:800;font-size:clamp(1.1rem,5vw,1.9rem);padding:10px 12px;border:3px solid var(--gold);border-radius:8px;text-transform:uppercase}
.tag{text-align:center;font-style:italic;font-weight:600;margin:18px 16px 0}
.hero{max-width:760px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;justify-content:center;gap:24px}
.hero img{height:190px;width:auto;flex:none}
#cd .lbl{font-weight:600;margin-bottom:6px}
.clock{display:flex;gap:8px}
.clock div{min-width:62px;text-align:center;padding:8px 6px;background:var(--black);border-radius:10px;border-bottom:3px solid var(--gold)}
.clock b{display:block;font-weight:900;font-size:1.6rem;line-height:1.1;color:var(--gold)}
.clock span{font-size:.75rem;color:#fff}
nav{max-width:720px;margin:14px auto 0;padding:0 20px;display:flex;gap:8px;justify-content:center}
nav button{margin:0;width:auto;padding:8px 20px;background:#fff;color:var(--black);border:2px solid var(--black);border-radius:99px}
nav button[aria-pressed=true]{background:var(--black);color:var(--gold)}
main{max-width:720px;margin:auto;padding:16px 20px 60px}
.card{background:var(--cream);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:12px;padding:20px;margin-bottom:16px}
h2{font-weight:800;font-size:1.2rem;margin:0 0 12px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select{width:100%;padding:12px;font:inherit;color:inherit;background:#fff;border:1px solid #cfc7ae;border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{margin-top:18px;width:100%;padding:14px;font:800 1rem Montserrat,sans-serif;background:var(--red);color:#fff;border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
fieldset{border:0;padding:0;margin:0}
.opt{display:flex;gap:12px;align-items:center;padding:10px 12px;background:#fff;border:2px solid var(--line);border-radius:10px;margin-top:8px;font-weight:600;cursor:pointer}
.opt input{width:auto;margin:0;accent-color:var(--red)}
.opt:has(input:checked){border-color:var(--red);background:#fff4f4}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:var(--black);color:var(--gold);display:grid;place-items:center;font-weight:900;font-size:1.1rem}
.msg{padding:14px;border-radius:8px;margin-top:14px;font-weight:600}
.ok{background:#e4f5e8}
.err{background:#fde3e3}
.hint{font-size:.88rem;opacity:.7;margin:4px 0 0}
.row{display:flex;gap:12px;align-items:center;margin-top:12px}
.row .grow{flex:1;min-width:0}
.top2{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.bar{height:10px;background:#e6dfcc;border-radius:99px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.row.lead .bar i{background:var(--gold)}
#inst button{width:auto;margin-top:10px;padding:10px 22px;background:var(--gold);color:var(--black)}
footer{background:var(--black);color:#fff;text-align:center;padding:18px;font-size:.9rem;border-top:4px solid var(--red)}
@media (max-width:520px){.hero{flex-direction:column;gap:10px}.hero img{height:140px;order:2}}
</style>
</head>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwE_pNZ7aYEdG6iSG8Frmf57amodWSDkAZ7UFB4kwRGEU6a6OShL4CWiyi2P3Hj4Bmk0A/exec";

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const setPhase = t => document.getElementById("phase").textContent = t;
let DATA, timer;

// Nominee photo, or the first letter if there is no photo
function avatar(n) {
  const initial = `<span class="av" aria-hidden="true">${esc(n.name.charAt(0).toUpperCase())}</span>`;
  if (!n.image) return initial;
  return `<img class="av" src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=this.dataset.f" data-f="${esc(initial)}">`;
}

async function load() {
  try {
    DATA = await (await fetch(API_URL)).json();
    countdown(DATA.deadline);
    setPhase({ nominations: "Award Nomination", voting: "Award Voting" }[DATA.phase] || "Awards 2026");
    const tabs = [];
    if (DATA.phase === "nominations") tabs.push(["Nominate", nominateView]);
    if (DATA.phase === "voting") tabs.push(["Vote", voteView]);
    if (DATA.showResults) tabs.push(["Results", resultsView]);
    if (!tabs.length) { app.innerHTML = '<div class="card"><h2>Thank you</h2><p>Nominations and voting are closed. Winners will be announced at the ceremony.</p></div>'; return; }
    const nav = document.getElementById("nav");
    if (tabs.length > 1) {
      nav.hidden = false;
      nav.innerHTML = tabs.map((t, i) => `<button data-i="${i}">${t[0]}</button>`).join("");
      nav.onclick = e => { const i = e.target.dataset.i; if (i !== undefined) open(i); };
    }
    const open = i => {
      [...nav.children].forEach((b, j) => b.setAttribute("aria-pressed", j == i));
      tabs[i][1](DATA);
    };
    open(0);
  } catch (e) {
    setPhase("Offline");
    app.innerHTML = '<div class="card msg err">Could not load. Check your connection and refresh.</div>';
  }
}

function countdown(dl) {
  const box = document.getElementById("cd");
  const end = dl && new Date(dl.at).getTime();
  if (!end || isNaN(end) || end < Date.now()) return;
  box.hidden = false;
  document.getElementById("cdl").textContent = dl.label;
  const clock = document.getElementById("clock");
  const tick = () => {
    let s = Math.floor((end - Date.now()) / 1000);
    if (s <= 0) { clearInterval(timer); clock.innerHTML = "<div><b>0</b><span>Time is up. Refresh the page.</span></div>"; return; }
    const u = [["days", 86400], ["hours", 3600], ["mins", 60], ["secs", 1]];
    clock.innerHTML = u.map(([n, v]) => { const x = Math.floor(s / v); s %= v; return `<div><b>${x}</b><span>${n}</span></div>`; }).join("");
  };
  tick(); timer = setInterval(tick, 1000);
}

async function send(payload) {
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) });
  return r.json();
}
function show(el, ok, text) { el.className = "msg " + (ok ? "ok" : "err"); el.textContent = text; }

function nominateView(d) {
  app.innerHTML = `
  <form class="card" id="f">
    <h2>Nominate someone</h2>
    <label for="cat">Category</label>
    <select id="cat" required>${d.categories.map(c => `<option>${esc(c.name)}</option>`).join("")}</select>
    <label for="nom">Nominee name</label>
    <input id="nom" required maxlength="100" placeholder="Person, organisation or project">
    <label for="det">Why they deserve it (optional)</label>
    <input id="det" maxlength="200">
    <label for="by">Your name</label>
    <input id="by" maxlength="100">
    <label for="con">Your email or phone</label>
    <input id="con" required maxlength="100">
    <p class="hint">Used only to prevent spam. It is never shown publicly.</p>
    <button>Submit nomination</button>
    <div id="out" role="status"></div>
  </form>`;
  const f = document.getElementById("f"), out = document.getElementById("out");
  f.onsubmit = async e => {
    e.preventDefault();
    const b = f.querySelector("button"); b.disabled = true;
    try {
      const r = await send({ action: "nominate", category: cat.value, nominee: nom.value, details: det.value, by: by.value, contact: con.value });
      if (r.ok) { show(out, true, "Nomination received. You can nominate in other categories too."); nom.value = det.value = ""; }
      else show(out, false, r.error);
    } catch { show(out, false, "Could not submit. Try again."); }
    b.disabled = false;
  };
}

function voteView(d) {
  const cats = d.categories.filter(c => c.nominees.length);
  app.innerHTML = `<form id="f">
    ${cats.map((c, i) => `<fieldset class="card"><legend><h2>${esc(c.name)}</h2></legend>
      ${c.nominees.map(n => `<label class="opt"><input type="radio" name="c${i}" value="${esc(n.name)}">${avatar(n)}<span>${esc(n.name)}</span></label>`).join("")}
    </fieldset>`).join("")}
    <div class="card">
      <label for="voter">Your email or phone</label>
      <input id="voter" required maxlength="100">
      <p class="hint">One vote per category for each email or phone number. Skip any category you like.</p>
      <button>Submit my votes</button>
      <div id="out" role="status"></div>
    </div></form>`;
  const f = document.getElementById("f"), out = document.getElementById("out");
  f.onsubmit = async e => {
    e.preventDefault();
    const votes = {};
    cats.forEach((c, i) => { const v = f.querySelector(`input[name=c${i}]:checked`); if (v) votes[c.name] = v.value; });
    if (!Object.keys(votes).length) return show(out, false, "Pick at least one nominee.");
    const b = f.querySelector("button"); b.disabled = true;
    try {
      const r = await send({ action: "vote", voter: voter.value, votes });
      if (r.ok) show(out, true, `Thank you. ${r.counted} vote(s) counted.` + (r.skipped ? ` ${r.skipped} skipped because you already voted there.` : ""));
      else show(out, false, r.error);
    } catch { show(out, false, "Could not submit. Try again."); }
    b.disabled = false;
  };
}

async function resultsView() {
  app.innerHTML = '<div class="card">Loading results…</div>';
  try {
    const r = await (await fetch(API_URL + "?action=results")).json();
    if (!r.ok) { app.innerHTML = '<div class="card"><h2>Results</h2><p>Results are not public yet.</p></div>'; return; }
    app.innerHTML = r.categories.map(c => `<section class="card"><h2>${esc(c.name)}</h2>
      ${c.nominees.length ? c.nominees.map((n, i) => {
        const p = c.total ? Math.round(n.votes / c.total * 100) : 0;
        return `<div class="row${i === 0 && n.votes ? " lead" : ""}">${avatar(n)}<div class="grow">
          <div class="top2"><span>${esc(n.name)}</span><span>${p}% · ${n.votes}</span></div>
          <div class="bar"><i style="width:${p}%"></i></div></div></div>`;
      }).join("") : '<p class="hint">No nominees yet.</p>'}
      <p class="hint">${c.total} vote${c.total === 1 ? "" : "s"} in this category</p></section>`).join("");
  } catch { app.innerHTML = '<div class="card msg err">Could not load results. Refresh and try again.</div>'; }
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let ev;
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); ev = e; if (!standalone) document.getElementById("inst").hidden = false; });
document.getElementById("instBtn").onclick = async () => { if (ev) { ev.prompt(); await ev.userChoice; ev = null; document.getElementById("inst").hidden = true; } };
if (/iphone|ipad/i.test(navigator.userAgent) && !standalone) { document.getElementById("inst").hidden = false; document.getElementById("instBtn").hidden = true; document.getElementById("iosHint").hidden = false; }
load();
</script>
